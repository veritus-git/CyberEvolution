<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CyberEvolution" />
    <meta name="theme-color" content="#07090e" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>CyberEvolution — Cyberpunkowa Gra 2D</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      window.addEventListener('error', function(e) {
        var b = document.getElementById('error-banner');
        if (b) {
          b.textContent = 'Błąd: ' + (e.message || e);
          b.classList.remove('hidden');
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var b = document.getElementById('error-banner');
        if (b) {
          b.textContent = 'Błąd Promise: ' + (e.reason?.message || e.reason);
          b.classList.remove('hidden');
        }
      });
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-container">
        <!-- Dyskretny przycisk pełnego ekranu dla mobile -->
        <button id="btn-fullscreen" class="mobile-fullscreen-btn hidden" aria-label="Pełny ekran" title="Włącz / Wyłącz pełny ekran">⛶</button>

        <!-- Pasek narzędzi deweloperskich (widoczny tylko pod F2 / debug=1) -->
        <div id="mobile-top-bar" class="mobile-top-bar hidden">
          <button id="btn-switch-world" class="mobile-btn">Świat: Lobby</button>
          <button id="btn-toggle-debug" class="mobile-btn">F2: Hitboxy</button>
          <button id="btn-cycle-skin" class="mobile-btn">Skin: 1</button>
        </div>

        <div id="error-banner" class="error-banner hidden"></div>
      </div>
    </div>

    <!-- Nakładka blokująca orientację pionową na urządzeniach mobilnych -->
    <div id="rotate-device-overlay" class="rotate-device-overlay hidden">
      <div class="rotate-device-content">
        <div class="rotate-device-phone-animation">
          <div class="phone-screen"></div>
        </div>
        <h2 class="rotate-device-title">OBRÓĆ TELEFON DO POZIOMU</h2>
        <p class="rotate-device-desc">CyberEvolution wymaga orientacji poziomej (Landscape) dla najlepszych wrażeń z gry.</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
