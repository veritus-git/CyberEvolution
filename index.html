<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Favicon & Icons (Official Game Identity) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="alternate icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- SEO & Social Meta Tags -->
    <title>CyberEvolution: Ścieżka Świadomości</title>
    <meta
      name="description"
      content="CyberEvolution: Ścieżka Świadomości – zręcznościowa platformówka 2D ucząca cyberbezpieczeństwa, weryfikacji źródeł, higieny haseł i odporności na manipulację w mediach społecznościowych."
    />

    <meta name="author" content="ZSO Oława (zespół CyberX)" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CyberEvolution: Ścieżka Świadomości" />
    <meta
      property="og:description"
      content="Zręcznościowy parkour w głąb internetowego szaleństwa. Pełnokrwista platformówka 2D z bossfightami na argumenty!"
    />
    <meta property="og:url" content="https://cyberevolution.zsolawa.edu.pl/" />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:locale" content="pl_PL" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CyberEvolution: Ścieżka Świadomości" />
    <meta
      name="twitter:description"
      content="Edukacyjna platformówka 2D o cyberbezpieczeństwie. Pokonaj algorytmy i dezinformację!"
    />
    <meta name="twitter:image" content="/icon-512.png" />

    <link rel="stylesheet" href="/src/style.css" />
    <script>
      function shouldIgnoreError(msg) {
        if (!msg) return true;
        var s = String(msg).toLowerCase();
        return s.indexOf('script error') !== -1 ||
               s.indexOf('resizeobserver') !== -1 ||
               s.indexOf('notsupportederror') !== -1 ||
               s.indexOf('notallowederror') !== -1 ||
               s.indexOf('fullscreen') !== -1 ||
               s.indexOf('orientation') !== -1;
      }
      window.addEventListener('error', function(e) {
        var msg = e.message || e;
        if (shouldIgnoreError(msg)) return;
        var b = document.getElementById('error-banner');
        if (b) {
          b.textContent = 'Błąd: ' + msg;
          b.classList.remove('hidden');
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var msg = e.reason?.message || e.reason;
        if (shouldIgnoreError(msg)) return;
        var b = document.getElementById('error-banner');
        if (b) {
          b.textContent = 'Błąd: ' + msg;
          b.classList.remove('hidden');
        }
      });
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-container">
        <!-- Player HUD Control Bar (Discrete & non-intrusive) -->
        <div id="player-hud-bar" class="player-hud-bar">
          <button id="btn-fullscreen" class="hud-circle-btn" aria-label="Pełny ekran" title="Włącz / Wyłącz pełny ekran (F11)">
            <svg id="icon-fs-expand" class="hud-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 3 21 3 21 9"></polyline>
              <polyline points="9 21 3 21 3 15"></polyline>
              <polyline points="21 15 21 21 15 21"></polyline>
              <polyline points="3 9 3 3 9 3"></polyline>
            </svg>
            <svg id="icon-fs-collapse" class="hud-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 14 10 14 10 20"></polyline>
              <polyline points="20 10 14 10 14 4"></polyline>
              <polyline points="14 20 14 14 20 14"></polyline>
              <polyline points="10 4 10 10 4 10"></polyline>
            </svg>
          </button>
          <button id="btn-audio" class="hud-circle-btn" aria-label="Dźwięk" title="Wycisz / Włącz dźwięk">
            <svg id="icon-audio-on" class="hud-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <svg id="icon-audio-off" class="hud-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>
          <button id="btn-help" class="hud-circle-btn" aria-label="Pomoc" title="Sterowanie i zasady gry (ESC)">
            <svg class="hud-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          </button>
        </div>

        <!-- Pasek narzędzi deweloperskich (widoczny tylko pod F2 / debug=1) -->
        <div id="mobile-top-bar" class="mobile-top-bar hidden">
          <button id="btn-switch-world" class="mobile-btn">Świat: Lobby</button>
          <button id="btn-toggle-debug" class="mobile-btn">F2: Hitboxy</button>
          <button id="btn-cycle-skin" class="mobile-btn">Skin: 1</button>
        </div>

        <div id="error-banner" class="error-banner hidden"></div>
      </div>
    </div>

    <!-- Nakładka blokująca orientację pionową na urządzeniach mobilnych -->
    <div id="rotate-device-overlay" class="rotate-device-overlay hidden">
      <div class="rotate-device-content">
        <div class="rotate-device-phone-animation">
          <div class="phone-screen"></div>
        </div>
        <h2 class="rotate-device-title">OBRÓĆ TELEFON DO POZIOMU</h2>
        <p class="rotate-device-desc">CyberEvolution wymaga orientacji poziomej (Landscape) dla precyzyjnego parkouru.</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
